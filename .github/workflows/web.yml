name: 웹앱

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 묶기 + 브라우저 시험
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: pyodide-${{ hashFiles('tools/build_web.py') }}
      - name: 웹앱 묶기
        run: python tools/build_web.py _site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 브라우저 준비
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: 브라우저 시험 (페이지 열기 → 1대2 만들기 → zip 내려받기)
        run: node tests/web/e2e.mjs _site web-test-output
      - name: 시험 화면 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 웹시험결과
          path: web-test-output/
          retention-days: 30
      - name: Pages 묶음 올리기
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: GitHub Pages 배포
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
