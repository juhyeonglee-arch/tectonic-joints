name: 시험

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 (한국 시간) — M2 진화 탐색 전체 시험

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
      M2_FULL: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 설치
        run: python -m pip install -r requirements-dev.txt
      - name: 시험 (설치 · 실행 · 예제 입력)
        run: python -m pytest -v
      - name: 확인 그림 모음 만들기
        if: always()
        run: python tools/contact_sheet.py test-output
      - name: 시험 결과 그림 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 시험결과-${{ matrix.os }}
          path: test-output/
          retention-days: 30
